    --good:#43C17E; --good-soft:#193F2C; --try:#FFA64D; --try-soft:#4A3318;
    --shade:#E8872E; --shape:#C9A13D; --empty:#2A375C; --wood:#8E6F3E;
  }
}
:root[data-theme="dark"]{
  --bg:#141D34; --grid:#1E2A48; --card:#1D2848; --ink:#EEF2FF; --muted:#A9B3D6; --line:#2E3C63;
  --num:#FF6B4F; --num-soft:#4A2622; --geo:#27C2BE; --geo-soft:#173F44; --stat:#9A83FF; --stat-soft:#2E2758;
  --good:#43C17E; --good-soft:#193F2C; --try:#FFA64D; --try-soft:#4A3318;
  --shade:#E8872E; --shape:#C9A13D; --empty:#2A375C; --wood:#8E6F3E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{
  margin:0; color:var(--ink); font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:18px; line-height:1.5;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);
  background-size:28px 28px;
}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:"Baloo 2","Nunito",system-ui,sans-serif;line-height:1.15}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:880px;margin:0 auto;padding:16px 16px 56px}
.small{margin:0;font-weight:800;font-size:15px;color:var(--muted)}
h1{margin:0 0 8px;font-size:clamp(32px,7vw,50px);font-weight:800}
.center{text-align:center;justify-content:center}

/* Hoot */
.hoot{width:100%;height:auto;display:block}
.hwrap{width:84px;flex:none}
.hwrap.bounce .hoot{animation:hop .6s ease}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.owlbox{width:108px;background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:8px;box-shadow:5px 5px 0 var(--ink);transform:rotate(-3deg)}

/* home */
.homebar{display:flex;justify-content:flex-end;gap:10px}
.hero{display:flex;gap:18px;align-items:center;margin:6px 0 24px}
.bubble{margin:0;background:var(--card);border:2px solid var(--ink);border-radius:18px 18px 18px 4px;padding:10px 16px;font-weight:700;display:inline-block}
.linkbtn{background:none;border:none;padding:6px 0;font-weight:800;font-size:15px;color:var(--muted);text-decoration:underline;cursor:pointer}
.strand{margin:30px 0}
.strand>h2{font-size:28px;margin:0 0 12px;color:var(--c);display:flex;gap:10px;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.tcard{text-align:left;background:var(--card);border:3px solid var(--c);border-radius:20px;padding:16px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"e n" "e t" "e g" "e s";column-gap:14px;box-shadow:5px 5px 0 var(--c)}
.tcard:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--c)}
.temoji{grid-area:e;font-size:42px;align-self:center}
.tnum{grid-area:n;font-size:14px;font-weight:800;color:var(--c)}
.ttl{grid-area:t;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:21px;line-height:1.15}
.ttag{grid-area:g;color:var(--muted);font-size:15px;margin-top:3px}
.stars{grid-area:s;margin-top:6px;font-size:22px;letter-spacing:3px}
.star{color:var(--line)} .star.on{color:var(--sun)}

/* bars and buttons */
.topbar{display:flex;align-items:center;gap:10px;margin:-6px -4px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 4px;z-index:5}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.back,.ghost{font-weight:800;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:9px 14px;cursor:pointer;min-height:44px}
.icon{width:44px;height:44px;border-radius:14px;border:2px solid var(--ink);background:var(--card);font-size:20px;cursor:pointer;flex:none}
.qcount{font-weight:800;white-space:nowrap}
.back{white-space:nowrap}
.primary{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:22px;background:var(--c);color:var(--btnink);border:2px solid var(--ink);border-radius:16px;padding:8px 22px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);min-height:48px}
.primary:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.muted{color:var(--muted);margin:0}

/* star trail */
.trail{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:0 0 12px}
.slot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:17px;font-weight:900;background:var(--card);color:var(--muted)}
.slot.cur{border:3px solid var(--c)}
.slot.full{background:var(--sun);border-color:var(--ink);color:var(--ink)}
.slot.half{background:var(--cs);border-color:var(--c);color:var(--c)}

/* lesson */
.lhead{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.bigemoji{font-size:60px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:18px 20px;margin:16px 0;box-shadow:5px 5px 0 var(--c)}
.learn{font-size:19px}
.learn p{margin:10px 0}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cardhead h2,.cardhead h3{margin:0;color:var(--c)}
.cardhead h2{font-size:26px}.cardhead h3{font-size:21px}
.speak{font-weight:800;font-size:15px;background:var(--cs);border:2px solid var(--c);border-radius:12px;padding:6px 12px;cursor:pointer;min-height:40px}
.tip{background:var(--cs);border-radius:14px;padding:10px 14px;margin:12px 0 4px;font-weight:700}
.sub{margin:26px 0 0;color:var(--c);font-size:26px}
.visual{margin:14px 0;overflow-x:auto;display:flex;justify-content:center}
.startrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px}

/* question */
.qtext{display:flex;gap:10px;align-items:flex-start;font-family:"Baloo 2",sans-serif;font-weight:700;font-size:clamp(22px,4.6vw,29px);line-height:1.25}
.qtext .speak{flex:none;margin-top:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:12px}
.opt{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:22px;background:var(--bg);border:3px solid var(--line);border-radius:16px;padding:10px 12px;cursor:pointer;min-height:64px}
.opts.big .opt{font-size:40px}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--c)}}
.opt.wrong{background:var(--try-soft);border-color:var(--try)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:12px;align-items:center;margin-top:12px;flex-wrap:wrap}
#numin{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:34px;width:150px;padding:4px 12px;border:3px solid var(--ink);border-radius:16px;background:var(--bg);color:var(--ink);text-align:center}
.unit{font-weight:800;font-size:24px}
.qfoot{margin-top:14px}
.hootrow{display:flex;align-items:flex-start;gap:14px;margin:8px 0 16px}
.speech{position:relative;flex:1;min-width:0;background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:12px 16px;font-weight:700;font-size:19px}
.speech::before{content:"";position:absolute;left:-10px;top:26px;width:16px;height:16px;background:inherit;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.speech.good{background:var(--good-soft);border-color:var(--good)}.speech.good::before{border-color:var(--good)}
.speech.try{background:var(--try-soft);border-color:var(--try)}.speech.try::before{border-color:var(--try)}
.speech.info{background:var(--cs);border-color:var(--c)}.speech.info::before{border-color:var(--c)}
.speech .primary{margin-top:12px;display:block}
.hintline{display:block;font-weight:600;margin-top:6px}

/* pictures */
.objs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;font-size:32px;line-height:1.2}
.five{display:inline-flex;gap:2px;padding:4px 6px;border:2px dashed var(--muted);border-radius:12px}
.o{position:relative;display:inline-block}
.o.gone>span{opacity:.35;filter:grayscale(1)}
.o.gone::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;color:var(--num);font-size:30px;font-weight:900}
.seq{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.box{min-width:62px;padding:6px 10px;text-align:center;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:28px;background:var(--card);border:3px solid var(--ink);border-radius:14px}
.box.q{border-color:var(--c);color:var(--c);border-style:dashed}
.seq.big .box{font-size:36px}
.plus{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.plus>b{font-size:40px;font-family:"Baloo 2",sans-serif}
.groups{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.grp{display:inline-flex;flex-wrap:wrap;justify-content:center;max-width:130px;gap:2px;font-size:28px;padding:8px 10px;border:3px solid var(--c);border-radius:40px}
.arr{display:grid;gap:8px}
.arr i{width:24px;height:24px;border-radius:50%;background:var(--c);display:block}
.to{display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px}
.rod{display:inline-flex;flex-direction:column;gap:2px;padding:2px;border:2px solid var(--ink);border-radius:5px}
.rod i,.ones i{width:16px;height:16px;background:var(--c);border-radius:3px;display:block}
.ones{display:inline-grid;grid-template-columns:repeat(2,16px);gap:3px;margin-left:10px}
.coinrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}
.coin{display:inline-grid;place-items:center;border-radius:50%;font-family:"Baloo 2",sans-serif;font-weight:800;color:#23284A;border:3px solid rgba(0,0,0,.3);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.c1{width:44px;height:44px;background:#D99058;font-size:15px}.c2{width:50px;height:50px;background:#D99058;font-size:16px}.c5{width:54px;height:54px;background:#E3AE70;font-size:17px}
.c10{width:58px;height:58px;background:#D8DCE4;font-size:18px}.c20{width:62px;height:62px;background:#EAD27A;font-size:18px}.c50{width:68px;height:68px;background:#C7CEDA;font-size:19px}
.purses{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.purse{border:3px solid var(--c);border-radius:18px;padding:8px 12px;text-align:center;font-weight:800}
.fsvg{width:230px;max-width:100%}.fsvg.circ{width:150px}
.clock{width:230px;max-width:100%}
.ruler{width:100%;max-width:540px}
.tally{width:100%}
.shp{width:200px;max-width:100%}
.bgraph{width:100%;max-width:440px}
.venn{width:100%;max-width:360px}
.picwrap{text-align:left}
.picto{border-collapse:collapse;font-size:20px}
.picto th{text-align:left;padding:6px 12px 6px 0;white-space:nowrap;border-bottom:2px solid var(--line)}
.picto td{padding:6px 0;letter-spacing:3px;border-bottom:2px solid var(--line)}
.legend{margin:8px 0 0;font-weight:700;color:var(--muted)}
.pgrid{display:grid;grid-template-columns:repeat(3,66px);gap:6px}
.pgrid span{height:66px;display:grid;place-items:center;font-size:40px;background:var(--card);border:2px solid var(--ink);border-radius:12px}
.bag{display:flex;flex-wrap:wrap;gap:6px;max-width:250px;justify-content:center;padding:14px 16px 20px;border:3px solid var(--ink);border-radius:18px 18px 70px 70px;font-size:28px;background:var(--card)}
.row3d{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;text-align:center}
.row3d div{font-size:48px;line-height:1.1}.row3d small{display:block;font-size:17px;font-weight:800}
.big3d{font-size:90px;line-height:1}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;font-weight:800}
.fr span:first-child{border-bottom:3px solid currentColor;padding:0 .2em 2px}.fr span:last-child{padding-top:2px}

/* end */
.end{text-align:center}
.end h1{margin-top:6px}
.endowl{width:130px;margin:0 auto}
.bigstars{font-size:74px;letter-spacing:10px;line-height:1.1;color:var(--sun)}
.bigstars .on{display:inline-block;animation:pop .55s both}
.bigstars .on:nth-child(2){animation-delay:.2s}.bigstars .on:nth-child(3){animation-delay:.4s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.badgesvg{width:140px;animation:pop .6s both}
.bigline{font-size:24px;font-weight:800;margin:6px 0}
.up{font-size:20px;font-weight:800;color:var(--good);margin:4px 0}
.enc{font-size:19px;font-weight:700;margin:8px auto 0;max-width:560px}
.endbtns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}

/* welcome */
.welcome{min-height:82vh;display:grid;place-items:center;text-align:center}
.welcome .hwrap{width:170px;margin:0 auto 6px}
#namein{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:32px;padding:8px 16px;border:3px solid var(--ink);border-radius:18px;background:var(--card);color:var(--ink);text-align:center;width:min(320px,90vw)}
.welcome .bubble{margin:6px 0 16px}
.welcome .primary{margin-top:16px}

/* sheet */
.sheet-back{position:fixed;inset:0;background:rgba(10,15,35,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:720px;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:24px 24px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));border:2px solid var(--ink);border-bottom:none}
@media (min-width:760px){.sheet-back{align-items:center}.sheet{border-radius:24px;border-bottom:2px solid var(--ink)}}
.sheet h2{margin:0 0 8px;color:var(--c);font-size:26px}
.sheet h3{margin:16px 0 4px;font-size:20px}
.sheet ul,.psec ul{margin:4px 0;padding-left:22px}
.sheet li,.psec li{margin:5px 0}
.pbox{background:var(--cs);border-radius:16px;padding:12px 16px;margin:12px 0}
.pbox h3{margin-top:0}
.sheetbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.resimg{display:block;max-width:100%;max-height:58vh;margin:8px auto;border-radius:12px;border:2px solid var(--line);-webkit-touch-callout:default}

/* grown-ups page */
.phead{display:flex;gap:16px;align-items:center;margin:6px 0 10px}
.phead .hwrap{width:96px}
.psec{background:var(--card);border:2px solid var(--ink);border-radius:22px;padding:18px 20px;margin:18px 0;box-shadow:5px 5px 0 var(--c)}
.psec h2{margin:0 0 10px;color:var(--c);font-size:26px}
.steps{padding-left:24px;margin:0}.steps li{margin:8px 0}
.tablewrap{overflow-x:auto}
table.prog{border-collapse:collapse;width:100%;min-width:600px;font-size:16px}
table.prog th,table.prog td{text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);vertical-align:middle}
table.prog th{font-size:14px;color:var(--muted)}
table.prog .stars{font-size:18px}
.callout{background:var(--cs);border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px;font-weight:700}
details.tg{border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin:10px 0;background:var(--bg)}
details.tg summary{cursor:pointer;font-family:"Baloo 2",sans-serif;font-weight:800;font-size:20px;list-style:none;display:flex;gap:10px;align-items:center;min-height:36px}
details.tg summary::-webkit-details-marker{display:none}
.chev{margin-left:auto;transition:transform .2s}
details[open]>summary .chev{transform:rotate(90deg)}
details.tg h3{margin:14px 0 4px;font-size:18px}
.revisit{border-top:2px dashed var(--line);padding:8px 0}
.revisit .visual{justify-content:flex-start}
.flag{display:inline-block;font-size:13px;font-weight:800;padding:1px 8px;border-radius:10px;background:var(--try-soft);color:var(--ink)}
.setrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.setrow input{font:inherit;font-size:18px;padding:8px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);min-width:0;flex:1;max-width:260px;min-height:44px}
.warnbtn{border-color:var(--try)!important}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:14px;border-radius:2px;animation:fall 1.5s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot))}}

@media (max-width:520px){
  .hero{flex-direction:column;align-items:flex-start}
  .card,.psec{padding:16px}
  .objs{font-size:28px}
  .hwrap{width:64px}
  .topbar .back{padding:8px 10px}
  .phead{flex-direction:column;align-items:flex-start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{--c:var(--num);--cs:var(--num-soft)}
body{min-height:100vh}
.bars{display:grid;gap:10px}.brow{display:grid;grid-template-columns:minmax(90px,38%) 1fr 48px;gap:10px;align-items:center;font-weight:700;font-size:15px}.bt{height:20px;background:var(--line);border-radius:6px;overflow:hidden;display:block}.bt span{display:block;height:100%;border-radius:6px}.bv{text-align:right;font-weight:800}
.lookgrid>div:first-child{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:3;background:var(--card);border-radius:14px}
@media (max-width:600px){.lookgrid>div:first-child{padding:4px 0 6px;border-bottom:2px dashed var(--line);border-radius:0}.buddyprev{width:78px}.lookgrid>div:first-child #bname{font-size:16px!important;margin:0!important}}
.appfoot{margin-top:36px;padding:14px 16px;border-top:2px dashed var(--line);font-size:14px;color:var(--muted);text-align:center;background:var(--card);border-radius:16px}
.appfoot p{margin:4px 0}.footlinks{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}.appfoot a,.appfoot .linkbtn,.sheet a,.psec a{color:var(--c);font-weight:800;font-size:15px}
.qclockrow{display:flex;justify-content:center;margin:-4px 0 8px}.qclock{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:3px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.timeline{font-size:20px;font-weight:800;margin:4px 0}
.subline{margin:0 0 10px;font-weight:800;color:var(--muted);font-size:17px}
.isnot{font-weight:900;letter-spacing:.02em}
.footlinks{display:flex;gap:22px;justify-content:center;align-items:center;flex-wrap:wrap}
.footlinks .linkbtn,.footlinks a.linkbtn{display:inline-flex;align-items:center;padding:6px 0;line-height:1.4;font-size:15px;font-weight:800;color:var(--c);text-decoration:underline;min-height:36px}
.chalbox{margin-top:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:2px dashed var(--c);border-radius:18px;padding:12px 16px}
.chalbox p{margin:2px 0 0}
.pill{display:inline-block;background:var(--sun);color:#1F2A5A;font-weight:900;border-radius:14px;padding:4px 14px;margin:6px 0}
.cbadge{display:inline-block;font-weight:800;font-size:13px;border-radius:10px;padding:2px 8px}.cbadge.ok{background:var(--good-soft);color:var(--ink)}.cbadge.part{background:var(--try-soft);color:var(--ink)}
table.ctable td{font-size:15px}
.tf{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,26px);gap:2px;border:2px solid var(--ink);border-radius:6px;padding:2px;background:var(--card)}
.frame i{width:26px;height:26px;display:grid;place-items:center;font-style:normal;font-size:18px;border:1px dashed var(--line)}
.dots,.scatter{width:100%;max-width:320px;background:var(--card);border:2px solid var(--line);border-radius:14px}
.nline{width:100%;max-width:420px}
.gsvg{max-width:100%;height:auto}
.opt.pic{display:flex;flex-direction:column;align-items:center;gap:4px}
.opt.pic svg{width:90px;height:auto}

.ivh-rodrow{display:flex;gap:4px;align-items:flex-end}
.ivh-rod{display:grid;grid-template-columns:16px;grid-auto-rows:12px;gap:1px;padding:3px;border:2.5px solid var(--ink);border-radius:7px;background:var(--card);cursor:pointer}
.ivh-rod i{background:var(--c);border-radius:2px;display:block}

.ivh-ones i{height:17px;background:var(--sun);border:1.5px solid var(--ink);border-radius:4px;display:block;cursor:pointer}

.ivh-modes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

.ivh-clock{width:230px;max-width:100%;height:auto;touch-action:none;cursor:pointer}
.ivh-carroll{border-collapse:collapse;margin:6px auto 0;background:var(--card)}

.ivh-carroll th{background:var(--cs);font-size:12.5px}
.ivh-carroll td{cursor:pointer;position:relative}

.ivh-chip{display:inline-block;background:var(--sun);color:#1F2A5A;border:2px solid var(--ink);border-radius:10px;padding:1px 10px;font-weight:800;font-size:20px}

function balanceSVG(a,b,leftDown){const t=leftDown?-12:12;return `<svg viewBox="0 0 280 190" class="shp" style="width:280px" role="img" aria-label="balance scale"><polygon points="140,96 118,178 162,178" fill="var(--wood)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/><g transform="rotate(${t} 140 96)"><line x1="30" y1="96" x2="250" y2="96" stroke="var(--ink)" stroke-width="7" stroke-linecap="round"/><path d="M5,96 Q55,128 105,96 Z" fill="var(--shape)" stroke="var(--ink)" stroke-width="3"/><path d="M175,96 Q225,128 275,96 Z" fill="var(--shape)" stroke="var(--ink)" stroke-width="3"/><text x="55" y="88" text-anchor="middle" font-size="44">${a}</text><text x="225" y="88" text-anchor="middle" font-size="44">${b}</text></g><circle cx="140" cy="96" r="7" fill="var(--ink)"/></svg>`}

{id:'count',strand:0,emoji:'🔢',title:'Counting and Patterns',tag:'Count to 20, see how many, and find patterns',objs:['1Nc.01','1Nc.02','1Nc.03','1Nc.04','1Nc.05','1Nc.06'],

   if(Math.random()<.5)return{obj:'1Np.04',kind:'Ordinal numbers (1st to 10th)',text:`Which animal is ${ords[i]} in the line? The 1st is next to the flag.`,visual:vis,type:'mc',options:shuffle([row[i],...shuffle(row.filter((_,j)=>j!==i)).slice(0,2)]),answer:row[i],big:true,hint:'Start at the flag and count: 1st, 2nd, 3rd…'};
   return{obj:'1Np.04',kind:'Ordinal numbers (1st to 10th)',text:`What place is the ${row[i]} in? The 1st is next to the flag.`,visual:vis,type:'mc',options:fillOpts(ords[i],ords.slice(0,n)),answer:ords[i],hint:'Start at the flag and count: 1st, 2nd, 3rd…'}}
  if(k==='ordw'){const i=R(0,8);return{obj:'1Np.04',kind:'Ordinal numbers (1st to 10th)',text:`Which place comes just after ${sayOrd(i+1)}?`,type:'mc',options:fillOpts(sayOrd(i+2),[sayOrd(i+1),sayOrd(i+3>10?i:i+3),sayOrd(Math.max(1,i))].filter((x,j,a)=>a.indexOf(x)===j)),answer:sayOrd(i+2),big:true,hint:`Say them in order: ${ORDW.slice(0,Math.min(10,i+3)).join(', ')}.`}}
  const a=R(3,9),b=R(11,19);return{obj:'1Np.03',kind:'Thinking: is it right?',text:`${pick(KIDS)} says ${a} is bigger than ${b} because ${a} is a big number. Is that right?`,type:'mc',options:YN,answer:'No',hint:`Which comes later when you count, ${a} or ${b}?`}},
 chal(){const k=R(0,1);if(k===0){const a=R(10,99);let b=R(10,99);while(b===a)b=R(10,99);return{obj:'2Np.03',kind:'Challenge: comparing 2-digit numbers',text:'Which number is bigger?',type:'mc',options:[String(a),String(b)],answer:String(Math.max(a,b)),big:true,hint:'Look at the tens first. If they are the same, look at the ones.'}}
  const s=new Set();while(s.size<3)s.add(R(10,99));const asc=[...s].sort((x,y)=>x-y),right=asc.join(', ');const o=new Set([right]);while(o.size<3)o.add(shuffle(asc).join(', '));return{obj:'2Np.03',kind:'Challenge: ordering 2-digit numbers',text:'Which list goes from smallest to biggest?',type:'mc',options:shuffle([...o]),answer:right,hint:'Compare the tens first.'}}},

{id:'add',strand:0,emoji:'➕',title:'Adding',tag:'Count on, put together, pairs to 10 and doubles',objs:['1Ni.02','1Ni.04','1Ni.05','1Ni.06'],
 intro:`<p>Adding means finding how many <b>altogether</b>.</p><p>We can <b>put two groups together</b> and count them all. Or we can start at the bigger number and <b>count on</b>. For 8 + 3: start at 8, then say 9, 10, 11.</p><p><b>Pairs that make 10</b> are very useful: 1 + 9, 2 + 8, 3 + 7, 4 + 6, 5 + 5.</p><p>A <b>double</b> is adding a number to itself. Double 4 is 4 + 4 = 8.</p><div class="tip">💡 Before you add, <b>estimate</b>: will the answer be more than 10 or less than 10?</div>`,
 examples:()=>[{title:'Putting together',visual:`<div class="plus">${objs(4,'🍎')}<b>+</b>${objs(3,'🍎')}</div>`,text:'4 apples and 3 apples. Count them all: <b>7</b> apples. So 4 + 3 = 7.'},{title:'Pairs that make 10',visual:bondFrame(7),text:'7 red and 3 blue make 10. 7 and 3 make <b>10</b>. So do 6 and 4, and 5 and 5.'}],
 gen(){const k=pick(['sets','sets','on','on','bond','bond','w20','w20','dbl','dbl','est','word','twm']);
  if(k==='sets'){const e=pick(ITEMS),a=R(1,9),b=R(1,Math.min(9,20-a));return{obj:'1Ni.02',kind:'Putting two groups together',text:`${a} ${NAMES[e]} and ${b} more. How many altogether?`,visual:`<div class="plus">${objs(a,e)}<b>+</b>${objs(b,e)}</div>`,type:'num',answer:a+b,hint:'Count them all, touching each one.'}}
  if(k==='on'){const a=R(5,15),b=R(1,Math.min(5,20-a));return{obj:'1Ni.02',kind:'Adding by counting on',text:`Start at ${a} and count on ${b}. Where do you land?`,visual:trackHTML(0,20,v=>v===a),type:'num',answer:a+b,hint:`Put your finger on ${a}, then make ${b} jumps.`}}
  if(k==='bond'){const a=R(0,10);return Math.random()<.5?{obj:'1Ni.04',kind:'Pairs that make 10',text:`${a} + ? = 10`,type:'num',answer:10-a,hint:`Count on from ${a} to 10. Use your fingers.`}:{obj:'1Ni.04',kind:'Pairs that make 10',text:`How many more make 10?`,visual:tenFrames(a,'🟢')+(a===0?'<p class="muted center">The frame is empty.</p>':''),type:'num',answer:10-a,hint:'Count the empty squares.'}}
  if(k==='w20'){const a=R(1,12),b=R(1,Math.min(9,20-a));return{obj:'1Ni.05',kind:'Adding within 20',text:`${a} + ${b} = ?`,type:'num',answer:a+b,hint:`Start at ${Math.max(a,b)} and count on ${Math.min(a,b)}.`}}
  if(k==='dbl'){const n=R(1,10);return Math.random()<.6?{obj:'1Ni.06',kind:'Doubles to double 10',text:`What is double ${n}?`,visual:`<div class="plus">${objs(n,'🔵')}<b>+</b>${objs(n,'🔵')}</div>`,type:'num',answer:2*n,hint:`Double means ${n} + ${n}.`}:{obj:'1Ni.06',kind:'Doubles to double 10',text:`${n} + ${n} = ?`,type:'num',answer:2*n,hint:'Adding a number to itself is a double.'}}
  if(k==='est'){let a,b;do{a=R(2,9);b=R(2,9)}while(a+b===10);return{obj:'1Ni.05',kind:'Estimating a sum',text:`Without working it out: is ${a} + ${b} more than 10 or less than 10?`,type:'mc',options:['More than 10','Less than 10'],answer:a+b>10?'More than 10':'Less than 10',hint:'Think of the pair that makes 10. Is the other number bigger or smaller?'}}
  if(k==='word'){const n=pick(KIDS),th=pick(['stickers','shells','crayons','marbles']),a=R(3,12),b=R(2,Math.min(8,20-a));return{obj:'1Ni.05',kind:'Adding word problems',text:`${n} has ${a} ${th} and gets ${b} more. How many ${th} now?`,type:'num',answer:a+b,hint:`"More" means add. Work out ${a} + ${b}.`}}
  const a=R(5,12),b=R(2,6);return{obj:'1Ni.02',kind:'Thinking: spot the mistake',text:`${pick(KIDS)} counts on to add ${a} + ${b} and says: "${[...Array(b)].map((_,i)=>a+i).join(', ')}". So ${a} + ${b} = ${a+b-1}. What went wrong?`,type:'mc',options:shuffle([`${a} was counted again`,'Nothing, it is right',`It should be taking away`]),answer:`${a} was counted again`,hint:`When you count on from ${a}, the first number you say is ${a+1}.`}},
 chal(){const k=R(0,2);if(k===0){const a=R(1,19);return{obj:'2Ni.03',kind:'Challenge: pairs that make 20',text:`${a} + ? = 20`,type:'num',answer:20-a,hint:'Make 10 first, then add another 10.'}}
  if(k===1){const t=R(1,9);return{obj:'2Ni.03',kind:'Challenge: tens that make 100',text:`${t*10} + ? = 100`,type:'num',answer:100-t*10,hint:`Count in tens from ${t*10} up to 100.`}}
  const [a,b]=noRegAdd(true);return{obj:'2Ni.04',kind:'Challenge: adding 2-digit numbers',text:`${a} + ${b} = ?`,type:'num',answer:a+b,hint:`Add the ones first: ${a%10} + ${b%10}. Then add the tens.`}}},

{id:'sub',strand:0,emoji:'➖',title:'Taking Away',tag:'Count back, take away, and find the difference',objs:['1Ni.03','1Ni.05'],

 examples:()=>[{title:'Taking away',visual:objs(8,'🍪',3),text:'8 cookies, 3 are eaten. <b>5</b> are left. So 8 − 3 = 5.'},{title:'The difference',visual:`<div class="purses"><div class="purse">${objs(7,'⭐')}</div><div class="purse">${objs(4,'⭐')}</div></div>`,text:'7 stars and 4 stars. Match them up: 3 are left over. The difference is <b>3</b>.'}],
 gen(){const k=pick(['take','take','back','back','diff','diff','w20','w20','miss','word','twm']);
  if(k==='take'){const e=pick(ITEMS),n=R(4,15),m=R(1,Math.min(9,n-1));return{obj:'1Ni.03',kind:'Taking away objects',text:`There are ${n} ${NAMES[e]}. ${m} are taken away. How many are left?`,visual:objs(n,e,m),type:'num',answer:n-m,hint:'Count the ones that are not crossed out.'}}
  if(k==='back'){const a=R(8,20),b=R(1,5);return{obj:'1Ni.03',kind:'Taking away by counting back',text:`Start at ${a} and count back ${b}. Where do you land?`,visual:trackHTML(0,20,v=>v===a),type:'num',answer:a-b,hint:`Put your finger on ${a}, then make ${b} jumps back.`}}
  if(k==='diff'){const e=pick(ITEMS),b=R(2,8),a=b+R(1,6);return{obj:'1Ni.03',kind:'Finding the difference',text:`What is the difference between ${a} and ${b}?`,visual:`<div class="purses"><div class="purse">${objs(a,e)}</div><div class="purse">${objs(b,e)}</div></div>`,type:'num',answer:a-b,hint:'Match them up. How many have no partner?'}}
  if(k==='w20'){const a=R(5,20),b=R(1,Math.min(9,a));return{obj:'1Ni.05',kind:'Taking away within 20',text:`${a} − ${b} = ?`,type:'num',answer:a-b,hint:`Start at ${a} and count back ${b}.`}}
  if(k==='miss'){const a=R(6,15),c=R(1,a-1);return{obj:'1Ni.05',kind:'Missing number in taking away',text:`${a} − ? = ${c}`,type:'num',answer:a-c,hint:`Count on from ${c} up to ${a}.`}}
  if(k==='word'){const a=R(6,20),b=R(1,Math.min(8,a-1));return{obj:'1Ni.05',kind:'Taking away word problems',text:`${pick(KIDS)} had ${a} balloons. ${b} flew away. How many are left?`,type:'num',answer:a-b,hint:`"Left" means take away. Work out ${a} − ${b}.`}}
  const a=R(10,16),b=R(2,5);return{obj:'1Ni.03',kind:'Thinking: is it right?',text:`${pick(KIDS)} counts back ${b} from ${a} and says: "${[...Array(b)].map((_,i)=>a-i).join(', ')}". So the answer is ${a-b+1}. Is that right?`,type:'mc',options:YN,answer:'No',hint:`The first jump back from ${a} lands on ${a-1}. Do not count ${a} itself.`}},
 chal(){const k=R(0,1);if(k===0){const [a,b]=noRegSub(true);return{obj:'2Ni.04',kind:'Challenge: taking away 2-digit numbers',text:`${a} − ${b} = ?`,type:'num',answer:a-b,hint:`Take the ones away first: ${a%10} − ${b%10}. Then the tens.`}}
  const a=R(3,9),b=R(1,a-1);return{obj:'2Ni.04',kind:'Challenge: taking away tens',text:`${a*10} − ${b*10} = ?`,type:'num',answer:(a-b)*10,hint:`${a} tens take away ${b} tens. How many tens are left?`}}},

{id:'frac',strand:0,emoji:'🍕',title:'Halves',tag:'Equal parts, half of an amount, and halves making wholes',objs:['1Nf.01','1Nf.02','1Nf.03','1Nf.04'],
 intro:`<p>When we cut something into <b>2 equal parts</b>, each part is a <b>half</b>.</p><p>The two parts must be the <b>same size</b>. If one part is bigger, they are not halves.</p><p>We can find half of a <b>group</b> by sharing it into 2 equal groups. Half of 8 is 4.</p><p><b>Two halves make a whole.</b></p>`,
 examples:()=>[{title:'Equal or not?',visual:`<div class="plus">${fracRect(2,1)}${fracRect(2,1,true)}</div>`,text:'The first shape has <b>2 equal parts</b>, so each part is a half. The second shape has 2 parts that are <b>not equal</b>.'},{title:'Half of a group',visual:groupsHTML(2,3,'🍓'),text:'6 strawberries shared into 2 equal groups. Half of 6 is <b>3</b>.'}],
 gen(){const k=pick(['equal','equal','ishalf','ishalf','set','of','of','whole','twm']);
  if(k==='equal'){const u=Math.random()<.5,c=!u&&Math.random()<.5;return{obj:'1Nf.01',kind:'Two equal parts or not',text:'Is this shape cut into 2 equal parts?',visual:c?fracCircle(2,0):fracRect(2,0,u),type:'mc',options:YN,answer:u?'No':'Yes',hint:'Are the two parts exactly the same size?'}}
  if(k==='ishalf'){const u=Math.random()<.4;return{obj:'1Nf.02',kind:'Is half coloured',text:'Is half of this shape coloured?',visual:u?fracRect(2,1,true):(Math.random()<.5?fracCircle(2,1):fracRect(2,1)),type:'mc',options:YN,answer:u?'No':'Yes',hint:'A half is one of 2 equal parts.'}}
  if(k==='set'){const n=R(1,6)*2,e=pick(ITEMS),sh=Math.random()<.6?n/2:pick([n/2+1,Math.max(1,n/2-1)]);return{obj:'1Nf.02',kind:'Half of a group of objects',text:`There are ${n} ${NAMES[e]}. ${pick(KIDS)} takes ${sh}. Is that half?`,visual:objs(n,e,sh),type:'mc',options:YN,answer:sh*2===n?'Yes':'No',hint:'Half means 2 equal groups. Are the crossed-out ones and the others the same number?'}}
  if(k==='of'){const n=R(1,10)*2,e=pick(ITEMS);return{obj:'1Nf.03',kind:'Half of a number',text:`What is half of ${n}?`,visual:n<=12?objs(n,e):'',type:'num',answer:n/2,hint:`Share ${n} into 2 equal groups, one for you and one for me.`}}
  if(k==='whole'){const q=pick([{t:'How many halves make one whole?',a:2,v:`<div class="plus">${fracCircle(2,1)}<b>+</b>${fracCircle(2,1)}</div>`},{t:'4 halves make how many wholes?',a:2,v:`<div class="plus">${fracCircle(2,1)}${fracCircle(2,1)}${fracCircle(2,1)}${fracCircle(2,1)}</div>`},{t:'Half a pizza and another half a pizza. How many whole pizzas?',a:1,v:`<div class="plus">${fracCircle(2,1)}<b>+</b>${fracCircle(2,1)}</div>`},{t:'6 halves make how many wholes?',a:3,v:''}]);return{obj:'1Nf.04',kind:'Halves make wholes',text:q.t,visual:q.v,type:'num',answer:q.a,hint:'Two halves fit together to make one whole.'}}
  const s=pick([['Any 2 pieces of a cake are halves.','No'],['2 halves make a whole.','Yes'],['Half of 10 is 5.','Yes'],['Half of 6 is 4.','No']]);return{obj:'1Nf.01',kind:'Thinking: is it true?',text:`Is this true? ${s[0]}`,type:'mc',options:YN,answer:s[1],hint:'Try it with real things at home.'}},
 chal(){const k=R(0,1);if(k===0){const f=pick([[4,1,'1/4'],[2,1,'1/2'],[4,3,'3/4']]);return{obj:'2Nf.02',kind:'Challenge: quarters',text:'What fraction is coloured?',visual:fracCircle(f[0],f[1]),type:'mc',options:shuffle(['1/2','1/4','3/4']),answer:f[2],big:true,hint:`There are ${f[0]} equal parts. How many are coloured?`}}
  const n=4*R(1,5);return{obj:'2Nf.04',kind:'Challenge: a quarter of a number',text:`What is one quarter of ${n}?`,type:'num',answer:n/4,hint:`Share ${n} into 4 equal groups.`}}},

{id:'money',strand:0,emoji:'💵',title:'Money',tag:'Know the coins and notes we use',objs:['1Nm.01'],

  if(k==='find'){const four=shuffle(D).slice(0,3),v=pick(four);return{obj:'1Nm.01',kind:'Finding a coin or note',text:`Which one is ${mname(v)}?`,type:'mc',options:four.map(mname),optHTML:four.map(x=>moneyHTML([x])),answer:mname(v),hint:'Look for the number on each one.'}}
  if(k==='more'){const [a,b]=shuffle(D).slice(0,2),more=Math.random()<.5;return{obj:'1Nm.01',kind:more?'Which is worth more':'Which is worth less',text:`Which is worth ${more?'more':'less'}?`,type:'mc',options:[mname(a),mname(b)],optHTML:[a,b].map(x=>moneyHTML([x])),answer:mname(more?Math.max(a,b):Math.min(a,b)),hint:'The bigger number is worth more, whatever the size.'}}
  if(k==='coinnote'){const v=pick(D);return{obj:'1Nm.01',kind:'Coin or note',text:`Is ${mname(v)} a coin or a note?`,type:'mc',options:['Coin','Note'],answer:v<5?'Coin':'Note',hint:'In riyals, 1 and 2 are coins. 5 and more are paper notes.'}}
  return sar?{obj:'1Nm.01',kind:'Thinking: is it right?',text:`${pick(KIDS)} says the 1 riyal coin is worth more than the 5 riyal note, because a coin is heavier. Is that right?`,type:'mc',options:YN,answer:'No',hint:'The number tells you the value, not the weight.'}:{obj:'1Nm.01',kind:'Thinking: is it right?',text:`${pick(KIDS)} says the biggest coin is always worth the most. Is that right?`,type:'mc',options:YN,answer:'No',hint:'The number tells you the value, not the size.'}},
 chal(){if(Math.random()<.5){const l=pickMoney(2,20);return{obj:'2Nm.02',kind:'Challenge: counting money',text:'How much money is there altogether?',visual:moneyHTML(l),type:'num',unit:munit(),answer:msum(l),hint:'Start with the biggest, then count on.'}}
  const v=R(3,20);return{obj:'2Nm.01',kind:'Challenge: reading a price',text:'How much does it cost?',visual:tagHTML(v),type:'mc',options:fillOpts(mname(v),[mname(v+1),mname(v+10),mname(Math.max(1,v-2))]),answer:mname(v),hint:CUR()==='SAR'?'SAR means riyals.':'c means cents.'}}},

{id:'shapes',strand:1,emoji:'🔷',title:'2D and 3D Shapes',tag:'Flat and solid shapes, sides, faces and turning',objs:['1Gg.01','1Gg.03','1Gg.06','1Gg.07'],

/* Pictures that help a child work the answer out. They never show the answer. */
const NQ=q=>{const t=(String(q.text).match(/\d+/g)||[]).map(Number);if(t.length>1)return t;
 const v=(String(q.visual||'').replace(/<[^>]*>/g,' ').match(/\d+/g)||[]).map(Number);return v.length>t.length?v:t};
const vhStepOf=n=>{let d=[];for(let i=1;i<n.length;i++)if(n[i]-n[i-1]>0)d.push(n[i]-n[i-1]);return d.length?Math.min(...d):1};
const vhCap=t=>`<p class="vhcap">${t}</p>`;
function vhJumps(seq,step,back){const u=66,W=seq.length*u+24;let s=`<svg viewBox="0 0 ${W} 88" class="vhsvg" style="max-width:${Math.min(W,340)}px">`;
 seq.forEach((v,i)=>{const x=22+i*u;s+=`<rect x="${x-24}" y="46" width="48" height="34" rx="8" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><text x="${x}" y="70" text-anchor="middle" font-size="19" font-weight="800" fill="var(--ink)" font-family="Baloo 2,sans-serif">${v}</text>`;
  if(i<seq.length-1){const x2=x+u;s+=`<path d="M${x+20},42 Q${(x+x2)/2},6 ${x2-20},42" fill="none" stroke="var(--c)" stroke-width="3"/><text x="${(x+x2)/2}" y="22" text-anchor="middle" font-size="15" font-weight="800" fill="var(--c)" font-family="Baloo 2,sans-serif">${back?'−':'+'}${step}</text>`}});
 return s+'</svg>'}
function vhPV(nums,cols){return `<table class="pv"><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${nums.map(n=>{const d=String(n).padStart(cols.length,'0').split('');return `<tr>${d.map(x=>`<td>${x}</td>`).join('')}</tr>`}).join('')}</table>`}
function vhFrames(a,b){const t=a+b,n=Math.min(t,20);let h='<div class="tf">',i=0;while(i<n){const k=Math.min(10,n-i);h+='<span class="frame">';for(let j=0;j<k;j++){h+=`<i>${i+j<a?'🔴':'🔵'}</i>`}h+='<i></i>'.repeat(10-k)+'</span>';i+=k}return h+'</div>'}
function vhEmptyFrames(a,total){let h='<div class="tf">';for(let i=0;i<total;i+=10){const k=Math.min(10,total-i);h+='<span class="frame">';for(let j=0;j<k;j++)h+=`<i>${i+j<a?'🔴':''}</i>`;h+='</span>'}return h+'</div>'}
function vhPairs(n){let h='<div class="pairs">';for(let i=0;i<n;i++)h+=`<i class="${i===n-1&&n%2?'odd':''}"></i>`;return h+'</div>'}
function vhSkip(step,upto){return trackHTML(0,upto,v=>v%step===0)+vhCap(`The coloured numbers are the ${step}s. Count along them.`)}
function vhCountUp(from,to){const n=Math.min(to-from,10);return `<div class="track">${[...Array(n+1)].map((_,i)=>`<span class="${i===0?'on':''}">${from+i}</span>`).join('')}</div>`+vhCap(`Start at ${from} and count up. Count how many steps you take.`)}
function vhTensBar(t){let h='<div class="tensbar">';for(let i=0;i<10;i++)h+=`<span class="${i<t?'on':''}">10</span>`;return h+'</div>'}
function vhSplit(a,b,op){return `<table class="pv split"><tr><th></th><th>Tens</th><th>Ones</th></tr><tr><td>${a}</td><td>${Math.floor(a/10)*10}</td><td>${a%10}</td></tr><tr><td>${op} ${b}</td><td>${Math.floor(b/10)*10}</td><td>${b%10}</td></tr></table>`+vhCap('Do the ones first, then the tens.')}
function vhHalfWall(){const row=(parts,lab)=>`<div class="fwrow">${[...Array(parts)].map(()=>`<span>${lab}</span>`).join('')}</div>`;
 return `<div class="fwall">${row(1,'1 whole')}${row(2,'half')}</div>`+vhCap('Two halves fit together to make one whole.')}
function vhMoneyCard(){return moneyHTML([1,2,5,10])+vhCap('The number on it tells you what it is worth, not its size.')}
function vhClockGuide(){let s='<svg viewBox="0 0 240 240" class="clock" style="max-width:230px"><circle cx="120" cy="120" r="92" fill="var(--card)" stroke="var(--ink)" stroke-width="5"/>';
 for(let i=0;i<12;i++){const a=-Math.PI/2+i*Math.PI/6,x=120+68*Math.cos(a),y=120+68*Math.sin(a);
  s+=`<text x="${x}" y="${y+7}" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)" font-family="Baloo 2,sans-serif">${i===0?12:i}</text>`}
 s+='<line x1="120" y1="120" x2="120" y2="62" stroke="#7A4FD0" stroke-width="6" stroke-linecap="round"/><line x1="120" y1="120" x2="168" y2="120" stroke="#F2711C" stroke-width="9" stroke-linecap="round"/><circle cx="120" cy="120" r="7" fill="var(--ink)"/></svg>';
 return s+vhCap("Short orange hand = the hour. Long purple hand = the minutes. On 12 it is o'clock, on 6 it is half past.")}
function vhDays(){return `<div class="ladder">${DAYS.map(d=>`<span>${d.slice(0,3)}</span>`).join('')}</div>`}
function vhMonths(){return `<div class="ladder wrap">${MONTHS.map(m=>`<span>${m.slice(0,3)}</span>`).join('')}</div>`}
function vhShapeChart(){const L=[['circle',0],['triangle',3],['square',4],['rectangle',4],['pentagon',5],['hexagon',6]];
 return `<div class="shchart">${L.map(s=>`<span>${shapeSVG(s[0])}<b>${s[1]?s[1]+' sides':'round'}</b></span>`).join('')}</div>`}
function vhSolid(){return `<svg viewBox="0 0 330 200" class="shp" style="max-width:320px"><g fill="var(--shape)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"><polygon points="40,60 120,60 120,140 40,140"/><polygon points="40,60 70,30 150,30 120,60"/><polygon points="120,60 150,30 150,110 120,140"/></g><circle cx="40" cy="140" r="7" fill="#E5484D"/><line x1="40" y1="140" x2="120" y2="140" stroke="#1E8F52" stroke-width="5"/><text x="172" y="86" font-size="15" font-weight="800" fill="#E5484D" font-family="Baloo 2,sans-serif">● vertex</text><text x="172" y="112" font-size="15" font-weight="800" fill="#1E8F52" font-family="Baloo 2,sans-serif">— edge</text><text x="172" y="138" font-size="15" font-weight="800" fill="var(--ink)" font-family="Baloo 2,sans-serif">▭ face</text><text x="60" y="105" font-size="14" font-weight="800" fill="var(--ink)" font-family="Baloo 2,sans-serif">face</text></svg>`+vhCap('Faces are the flat sides. Count the ones you cannot see too.')}
function vhTurns(){return `<div class="turnrow">${[['⬆️','start'],['➡️','quarter'],['⬇️','half'],['⬅️','three quarters']].map(a=>`<span><b>${a[0]}</b>${a[1]}</span>`).join('')}</div>`+vhCap('Turning clockwise: up, right, down, left. A whole turn comes back to the start.')}
function vhGridGuide(){return `<div class="pgrid">${['↖️','⬆️','↗️','⬅️','⭐','➡️','↙️','⬇️','↘️'].map(x=>`<span>${x}</span>`).join('')}</div>`+vhCap('Find the star first. Left is towards the ⬅️, above is towards the ⬆️.')}
function vhTallyGuide(){return tallySVG(12)+vhCap('Count each crossed group as 5: 5, 10… then count the single lines.')}
function vhGraphGuide(){return blockGraph([{label:'🍎',val:4,color:'#E5484D'},{label:'🍌',val:6,color:'#F2B01E'}])+vhCap('Count the blocks in one column at a time. For "how many more", find both numbers and take the smaller away.')}
function vhCarroll(){return carrollHTML(['Even','Odd'],['Less than 10','10 or more'])+vhCap('Ask two questions: is it even or odd, and is it less than 10?')}
function vhSortGuide(){return vennSVG()+vhCap('If both things are true, it goes in the middle. If neither is true, it goes outside.')}
function vhRepeat(){return patternHTML(['🔴','🔵','🟡','🔴','🔵','🟡','🔴'])+vhCap('Find the part that repeats, then say it again.')}
function vhRuler(){return rulerSVG(6)+vhCap('Start at 0, not at 1. Read the number at the end of the object.')}
function vhScale(){return scaleSVG(7,10,1,'')+vhCap('Find the arrow, then read the number it points to.')}
function vhMatch(){const a=5,b=3,u=42;let s=`<svg viewBox="0 0 ${a*u+24} 112" class="vhsvg" style="max-width:250px">`;
 for(let i=0;i<a;i++)s+=`<circle cx="${22+i*u}" cy="26" r="15" fill="var(--c)" stroke="var(--ink)" stroke-width="2"/>`;
 for(let i=0;i<b;i++)s+=`<circle cx="${22+i*u}" cy="86" r="15" fill="#F2B01E" stroke="var(--ink)" stroke-width="2"/>`;
 for(let i=0;i<b;i++)s+=`<line x1="${22+i*u}" y1="44" x2="${22+i*u}" y2="68" stroke="var(--muted)" stroke-width="2" stroke-dasharray="4 3"/>`;
 for(let i=b;i<a;i++)s+=`<text x="${22+i*u}" y="94" text-anchor="middle" font-size="20" font-weight="800" fill="var(--warn)" font-family="Baloo 2,sans-serif">?</text>`;
 return s+'</svg>'+vhCap('Match them one to one. The row with some left over has more.')}
function vhTools(){return `<div class="turnrow"><span><b>📏</b>how long</span><span><b>⚖️</b>how heavy</span><span><b>🫗</b>how much it holds</span><span><b>🌡️</b>how hot</span></div>`}

function vhShare(n,g,e){e=e||'🍓';return `<div class="vhrow">${objs(Math.min(n,20),e)}</div><div class="groups">${[...Array(g)].map(()=>'<span class="grp"></span>').join('')}</div>`+vhCap(`Deal them into the ${g} groups, one at a time, until none are left. Then count one group.`)}

/* ================= interactive visual hints ================= */
/* A visual hint can be a picture (a string) or something to tap and drag: {w:box=>...}.
   The child does the work. The widget never says the answer out loud. */
const IV=(w)=>({w});
const ivEl=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
const ivCap=(box,t)=>{const p=ivEl('p','vhcap',t);box.appendChild(p);return p};

/* 1. drag things into equal groups */
function ivDrag(n,g,opt){opt=opt||{};return IV(box=>{

 for(let k=0;k<g;k++){const d=ivEl('div','ivh-grp ivh-drop');d.appendChild(ivEl('b',null,'group '+(k+1)));gs.appendChild(d)}

 const cap=ivCap(box,opt.left?'Drag one into each group, then go round again. Stop when you cannot give every group one more.':'Drag one into each group, then go round again, until none are left.');
 const update=()=>{const left=pool.querySelectorAll('.ivh-drag').length;const per=[...gs.children].map(x=>x.querySelectorAll('.ivh-drag').length);const same=per.every(v=>v===per[0]);
  if(opt.left&&left<g&&same){line.textContent=left?`${left} cannot be shared. They are left over.`:'All shared. None left over.';return}
  if(left){line.textContent=`${left} left to share`;return}

 const zoneAt=(x,y)=>{if(ghost)ghost.style.display='none';const u=document.elementFromPoint(x,y);if(ghost)ghost.style.display='';const z=u&&u.closest('.ivh-drop');return z&&box.contains(z)?z:null};

})}

 box.appendChild(tf);
 const fillTo=!!opt.upto;let placed=0;
 const line=ivLine(box,fillTo?'Tap the empty squares to fill them.':`${b} blue ones to put in`);
 ivCap(box,fillTo?`Keep tapping until every square is full. Count the blue ones you put in.`:'Tap the empty squares to put the blue ones in. Fill the first frame to 10 first.');

  if(!fillTo&&placed>=b)return;c.textContent='🔵';placed++;

function ivTrack(start,opt){return IV(box=>{

 let pos=start,made=0;
 const say=()=>{if(opt.jumps){line.textContent=made<opt.jumps?`${made} of ${opt.jumps} jumps`:`${opt.jumps} jumps. Where did you land?`}

 ivCap(box,opt.jumps?`Tap the next number ${dir<0?'back':'on'} to make one jump.`:`Tap the next number ${dir<0?'back':'on'} to jump. Stop on the number with the yellow edge.`);

  if(opt.jumps&&made>=opt.jumps)return;if(opt.goal!=null&&pos===opt.goal)return;

function makeRound(t,mode){const n=mode==='chal'?5:10,gen=(mode==='chal'?t.chal:t.gen).bind(t);const out=[],seen=new Set();let g=0;while(out.length<n&&g<400){g++;const q=gen();q.kind=q.kind||'Word problems';const key=q.text+'|'+(q.visual||'')+'|'+q.answer;if(seen.has(key))continue;seen.add(key);out.push(q)}return out}

/* ---- how to help ---- */
function guideHTML(p){const who=esc(p.name);return `<section class="psec"><h2>How a good session works</h2><ol class="steps">
 <li><b>Read the lesson together.</b> Tap 🔊 to hear it read aloud. Talk through both examples, and ask ${who} to explain one back to you.</li>
 <li><b>Let ${who} answer the 10 questions.</b> Sit nearby, but let them try each question on their own first.</li>
 <li><b>When they get stuck, suggest the 💡 Hint button first.</b> After that, a <b>🖼️ Visual hint</b> button appears. On some questions it shows a picture. On others it gives your child something to tap or drag, like sharing strawberries into groups or moving the clock hands. None of them gives the answer away. On any question, the 👪 Grown-ups button shows you what to say and, only if needed, the answer.</li>
 <li><b>Celebrate the effort at the end.</b> Make the result picture together, whatever the score.</li>
 <li><b>Check the Analytics tab once a week.</b> Follow "What to do next" and try one home activity from the topic guides.</li></ol></section>
 <section class="psec"><h2>Start with real objects</h2><p>Children learn a new idea best in three steps: first with <b>real objects</b> (counters, coins, blocks), then with <b>pictures</b>, and only then with <b>numbers and symbols</b>. The app covers the picture and symbol steps. Before a new topic, spend a few minutes with real objects, using the "Try at home" ideas in each topic guide.</p><p>For example, for 2 + 1 = 3: put down 2 counters and 1 counter and count them all, then draw 2 circles and 1 circle, then write 2 + 1 = 3.</p></section>
 <section class="psec"><h2>Warm-up, normal rounds and challenges</h2><ul><li><b>🌱 Warm-up Check</b> (on the home page): getting-ready basics with numbers to 10. Do it first to spot any gaps.</li><li><b>Normal rounds</b>: 10 questions at Stage 1 level. These give the topic stars.</li><li><b>⭐ Challenge rounds</b> (on each lesson page): 5 questions from Stage 2. They are optional, and a good stretch once a topic has 2 or 3 stars.</li></ul><p class="muted">The order of topics is our suggestion. Follow your child's interest, or the order of your textbook if you use one.</p></section>
 <section class="psec"><h2>Asking good questions</h2><p>Good questions help your child think, not just answer. Try these:</p><ul><li><b>Before a topic:</b> "What do you already know about this?"</li><li><b>While working:</b> "How do you know?", "Is there another way?", "What do you notice?"</li><li><b>To check reasoning:</b> "Hoot says the answer is 45. Do you agree? Why?"</li><li><b>To connect ideas:</b> "What do you already know that could help here?"</li><li><b>To go further:</b> "What could we try next?"</li></ul><p class="muted">Each topic guide, and the 👪 panel on every question, has questions to ask for that topic.</p></section>
 <section class="psec"><h2>Giving helpful feedback</h2><ul><li><b>Be specific:</b> "You counted the tens first. That was smart!" helps more than "Good job".</li><li><b>Give it soon:</b> talk about a mistake while the question is still fresh.</li><li><b>Answer two questions:</b> "How am I doing?" and "What should I do next?"</li><li><b>Let them fix it:</b> after feedback, give your child the chance to try again. That is when the learning sticks.</li><li><b>Mistakes are welcome:</b> say it out loud, "Mistakes help us learn." Your face and voice matter too, so stay calm and warm.</li></ul></section>
 <section class="psec"><h2>Self-check and reflection</h2><p>After every round, the app asks "How did that feel?" (easy, OK or tricky) and gives a next step. You can see the answers in Analytics and Records.</p><p>A simple <b>maths journal</b> (a small notebook) works well too: once a week, your child draws or writes one thing they learned and one thing that still feels tricky. Look at it together.</p></section>
 <section class="psec"><h2>Helping during practice</h2><ul>
 <li>Let your child read the question and try first. Step in only after a first try.</li>
 <li>Use the 💡 Hint button, then the 🖼️ Visual hint, before explaining anything yourself.</li>
 <li>Praise the effort and the method ("You counted really carefully!") more than the right answer.</li>
 <li>Use real objects (coins, buttons, fruit) whenever a question feels hard.</li>
 <li>Keep sessions short: one or two topics, about 10 to 15 minutes, and stop while it is still fun.</li>
 <li>If a round goes badly, read the lesson again together before the next try. Don't repeat the round straight away.</li></ul></section>
 <section class="psec"><h2>How stars and badges work</h2>
 <p>A right answer on the first try earns 1 point. A right answer on the second try earns half a point. After two tries, Hoot shows the answer and a tip.</p>
 <p>9 or more points earns 3 stars, 7 or more earns 2 stars, and 4 or more earns 1 star. Below that, your child gets the Brave Learner badge, so every finished round is rewarded.</p>
 <p>A test is recorded only when all 10 questions are finished. A good aim is 2 stars before moving to the next topic, then coming back later for 3.</p></section>`}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

  central.push(new Uint8Array(ch.buffer),nmb);off+=30+nmb.length+d.length});

 const lrn=[['Learner','Theme','Buddy','Profile created','Tests in these dates']];ps.forEach(p=>lrn.push([p.name,THEMES[p.theme].name,`${p.buddy.name} (${buddyDesc(p.buddy)})`,dayKey(p.created||Date.now()),recs.filter(r=>r.p===p.id).length]));
 const orows=[['Learner','Objective','What it means','Topic','Answers','Right first try','Right first try %']];ps.forEach(p=>{const qs=recs.filter(r=>r.p===p.id&&r.m!=='chal').flatMap(r=>r.q);OBJ.forEach(o=>{const oq=qs.filter(q=>q.o===o[0]);orows.push([p.name,o[0],o[1],TBY[o[2]].title,oq.length,oq.filter(q=>q.r===1).length,oq.length?pct(oq.filter(q=>q.r===1).length,oq.length):''])})});
 const blob=buildXLSX([{name:'Summary',rows:sum,widths:[16,26,30,8,11,15,17,18,17,11,11,26]},{name:'Tests',rows:tests,widths:[16,12,11,10,9,26,30,12,12,7,8,15,17,18,11]},{name:'Questions',rows:qrows,widths:[16,12,8,26,30,12,10,10,48,30,16,13,14,18,10,9]},{name:'Objectives',rows:orows,widths:[16,10,60,30,10,15,17]},{name:'Learners',rows:lrn,widths:[16,18,28,16,20]}]);
 const nmx=who==='one'?(ps[0].name.replace(/[^\p{L}\p{N}]+/gu,'')||'Learner'):'AllLearners';
 m.textContent=await saveFile(`MathsAdventure_Stage1_Records_${nmx}_${from}_to_${to}.xlsx`,blob)}

/* ---- backup and restore ---- */
async function doBackup(){const d=new Date(),m=document.getElementById('bmsg');const data={app:'maths-adventure',stage:1,v:3,at:Date.now(),profiles:DB.profiles,records:DB.records};
 const name=`MathsAdventure_Stage1_Backup_${d.getDate()}${MONTHS3[d.getMonth()]}${String(d.getFullYear()).slice(2)}_${pad2(d.getHours())}${pad2(d.getMinutes())}.json`;
 const msg=await saveFile(name,new Blob([JSON.stringify(data)],{type:'application/json'}));if(/^Saved/.test(msg)){DB.settings.lastBackup=Date.now();save()}if(m)m.textContent=msg}
function readRestore(file){const r=new FileReader();r.onload=()=>{let o=null;try{o=JSON.parse(r.result)}catch(e){}
 if(o&&o.app==='maths-adventure'&&o.stage!==1){openSheet('<h2>That backup is from a different stage</h2><p>This is the Stage 1 app. Restore that file in the Maths Adventure app for its own stage. Choose a file whose name starts with MathsAdventure_Stage1_Backup.</p><div class="sheetbtns"><button class="primary" data-act="closesheet">Close</button></div>','--c:var(--geo);--cs:var(--geo-soft)');return}
 if(!o||o.app!=='maths-adventure'||!Array.isArray(o.profiles)||!Array.isArray(o.records)){openSheet('<h2>That file is not a Maths Adventure backup</h2><p>Choose a file whose name starts with MathsAdventure_Stage1_Backup.</p><div class="sheetbtns"><button class="primary" data-act="closesheet">Close</button></div>','--c:var(--geo);--cs:var(--geo-soft)');return}
 S.restore=o;const newP=o.profiles.filter(p=>!profById(p.id)).length,have=new Set(DB.records.map(x=>x.id)),newR=o.records.filter(x=>!have.has(x.id)).length;
 openSheet(`<h2>Restore from backup</h2><p>This backup was made on <b>${fmtDT(o.at)}</b>. It has <b>${o.profiles.length} learner${o.profiles.length===1?'':'s'}</b> (${o.profiles.map(p=>esc(p.name)).join(', ')}) and <b>${o.records.length} tests</b>.</p>
 <div class="pbox"><h3>Add to what's here (recommended)</h3><p>Adds ${newP} learner${newP===1?'':'s'} and ${newR} test${newR===1?'':'s'} this device doesn't have yet. Nothing here is removed.</p><button class="primary" data-act="rmerge">Add to what's here</button></div>
 <div class="pbox"><h3>Replace everything</h3><p>Deletes all learners and records on this device and puts the backup in their place.</p><button class="ghost warnbtn" data-act="rreplace">Replace everything</button></div>
 <div class="sheetbtns"><button class="ghost" data-act="closesheet">Cancel</button></div>`,'--c:var(--geo);--cs:var(--geo-soft)')};r.readAsText(file)}
function fixProfile(p){p.theme=THEMES[p.theme]?p.theme:'classic';p.buddy=normBuddy(p.buddy);p.rv=p.rv||{};p.legacy=p.legacy||{};return p}
function restoreMerge(){const o=S.restore;if(!o)return;o.profiles.forEach(p=>{if(!profById(p.id))DB.profiles.push(fixProfile(p))});const have=new Set(DB.records.map(x=>x.id));o.records.forEach(r=>{if(!have.has(r.id)&&r.q&&TBY[r.tp])DB.records.push(r)});finishRestore()}
function restoreReplace(){const o=S.restore;if(!o)return;DB.profiles=o.profiles.map(fixProfile);DB.records=o.records.filter(r=>r.q&&TBY[r.tp]);if(!profById(DB.settings.active))DB.settings.active=null;S.pp=null;finishRestore()}
function finishRestore(){S.restore=null;S.range=null;save();closeSheet();renderParents();const m=document.getElementById('bmsg');if(m)m.textContent='Restore finished.'}

/* ================= events ================= */
document.addEventListener('click',e=>{
 if(e.target&&e.target.id==='sheetback'){closeSheet();return}
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
 switch(a){
 case 'home':closeSheet();renderHome();break;
 case 'navstay':closeSheet();break;
 case 'navstop':closeSheet();renderLearn();break;
 case 'who':closeSheet();renderWho();break;
 case 'addp':renderWelcome();break;
 case 'pickp':DB.settings.active=b.dataset.id;save();sfx('tap');renderHome();break;
 case 'setname':setName();break;
 case 'mylook':{const p=prof();S.draft={id:p.id,name:p.name,theme:p.theme,buddy:normBuddy(p.buddy)};S.lookFrom='home';renderLook();break}
 case 'plook':{const p=profById(S.pp);S.draft={id:p.id,name:p.name,theme:p.theme,buddy:normBuddy(p.buddy)};S.lookFrom='parents';renderLook();break}
 case 'pickth':S.draft.theme=b.dataset.k;sfx('tap');renderLook(true);break;
 case 'pb':S.draft.buddy=setBuddyField(S.draft.buddy,b.dataset.f,b.dataset.v);sfx('tap');renderLook(true);break;
 case 'looksave':lookSave();break;
 case 'lookcancel':if(S.lookFrom==='parents')renderParents();else if(S.lookFrom==='home')renderHome();else renderWelcome();break;
 case 'topic':closeSheet();S.topic=TBY[b.dataset.id];renderLearn();break;
 case 'topicfor':{const p=profById(S.pp);if(p)DB.settings.active=p.id;save();S.topic=TBY[b.dataset.id];renderLearn();break}
 case 'learn':closeSheet();renderLearn();break;
 case 'start':startQuiz('normal');break;
 case 'startc':startQuiz('chal');break;
 case 'currency':DB.settings.currency=CUR()==='SAR'?'generic':'SAR';save();renderParents();break;
 case 'flip':{S.flips=S.flips||{h:0,t:0};const hd=Math.random()<.5;S.flips[hd?'h':'t']++;const l=document.getElementById('fliplast');if(l)l.textContent=hd?'🪙 Heads!':'🪙 Tails!';document.getElementById('fh').textContent=S.flips.h;document.getElementById('ft').textContent=S.flips.t;sfx('tap');break}
 case 'flipreset':{S.flips={h:0,t:0};['fh','ft'].forEach(i=>{const e=document.getElementById(i);if(e)e.textContent='0'});const l=document.getElementById('fliplast');if(l)l.textContent='Tap to flip';break}
 case 'say':say(S.say[b.dataset.say]||'');break;
 case 'opt':answer(S.qs[S.i].options[+b.dataset.i],b);break;
 case 'check':checkNum();break;
 case 'hint':if(!S.done){S.hint=true;sfx('tap');hootSays('info',`💡 ${esc(S.qs[S.i].hint)}`,'think');const sl=document.getElementById('vhslot');if(sl&&!sl.innerHTML&&!document.getElementById('vhbox').innerHTML&&vhFor(S.qs[S.i]))sl.innerHTML='<button class="ghost vhbtn" data-act="vhint">🖼️ Visual hint</button>'}break;
  case 'vhint':{const h=vhFor(S.qs[S.i]);if(h){S.hint=true;sfx('tap');const sl=document.getElementById('vhslot');if(sl)sl.innerHTML='';const box=document.getElementById('vhbox');
   if(box){if(typeof h==='object'&&h.w){box.innerHTML=`<div class="vhbox" style="${S.topic.style}"><span class="vhttl">🖐️ Try it yourself</span><div class="ivh-body"></div></div>`;h.w(box.querySelector('.ivh-body'));hootSays('info','Try it with your finger!','think')}
   else{box.innerHTML=`<div class="vhbox" style="${S.topic.style}"><span class="vhttl">🖼️ Here is a picture to help</span>${h}</div>`;hootSays('info','Look at the picture. It helps you work it out.','think')}}}break}
 case 'next':S.i++;if(S.i>=S.qs.length)renderEnd();else renderQ();break;
 case 'sound':DB.settings.sound=!DB.settings.sound;save();if(b.classList.contains('icon')){b.textContent=DB.settings.sound?'🔔':'🔕';b.setAttribute('aria-label','Sounds '+(DB.settings.sound?'on':'off'))}else b.textContent=DB.settings.sound?'🔔 On':'🔕 Off';sfx('tap');break;
 case 'phelp':gate(()=>openSheet(helpHTML(),S.topic.style));break;
 case 'gatego':gateGo();break;
 case 'reveal':{const r=document.getElementById('revealed');if(r)r.hidden=false;b.hidden=true;break}
 case 'closesheet':closeSheet();break;
 case 'parents':closeSheet();renderParents();break;
 case 'pp':S.pp=b.dataset.id;renderParents();break;
 case 'ptab':S.ptab=b.dataset.t;renderParents();break;
 case 'rq':quickRange(b.dataset.d);renderParents();break;
  case 'expimg':exportAnalyticsImage();break;
  case 'expcurric':exportCurricHTML();break;
 case 'makepic':makePic();break;
 case 'savepic':savePic();break;
 case 'psavename':{const v=cleanName(document.getElementById('pname').value),m=document.getElementById('pnamemsg'),p=profById(S.pp);if(!v){m.textContent='Type a name first.';break}p.name=v;save();renderParents();break}
 case 'pdel':if(S.armed!=='pdel'){S.armed='pdel';b.textContent='Tap again to delete for good';setTimeout(()=>{if(S.armed==='pdel'){S.armed='';if(document.body.contains(b))b.textContent='Delete this learner and their records'}},4000)}else{const id=S.pp;DB.profiles=DB.profiles.filter(p=>p.id!==id);DB.records=DB.records.filter(r=>r.p!==id);if(DB.settings.active===id)DB.settings.active=null;S.pp=null;save();renderParents()}break;
 case 'xlsx':exportXLSX();break;
 case 'feel':{const r=DB.records.find(x=>x.id===S.lastRecId);if(r){r.f=b.dataset.v;save()}document.querySelectorAll('[data-act="feel"]').forEach(x=>x.classList.toggle('sel',x===b));const m=document.getElementById('feelmsg');if(m)m.textContent=feelMsg(b.dataset.v,S.last?S.last.lvl:0);sfx('tap');break}
 case 'about':openSheet(aboutHTML()+'<div class="sheetbtns"><button class="primary" data-act="closesheet">Close</button></div>','--c:var(--geo);--cs:var(--geo-soft)');break;
 case 'pclock':{const p=profById(S.pp);if(p){p.clock=!p.clock;save();renderParents()}break}
 case 'backup':doBackup();break;
 case 'rmerge':restoreMerge();break;
 case 'rreplace':if(S.armed!=='rrep'){S.armed='rrep';b.textContent='Tap again to replace everything'}else{S.armed='';restoreReplace()}break;
 }});
document.addEventListener('change',e=>{const id=e.target&&e.target.id;
 if(id==='rfrom'||id==='rto'){const f=document.getElementById('rfrom').value,t=document.getElementById('rto').value;if(f&&t&&f<=t){S.range={from:f,to:t,q:'custom'};renderParents()}}
 if(id==='restorein'&&e.target.files&&e.target.files[0]){readRestore(e.target.files[0]);e.target.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
/* ================= phone back button ================= */
/* The app is one page, so the phone's back button used to close it straight away.
   Each screen now has a level; the app keeps one browser history step per level,
   so the back button walks back through the app instead. */
const NAV={depth:0,ignore:0,fromPop:false};
const navLevel=()=>({home:1,who:1,welcome:1,learn:2,parents:2,look:2,q:3,end:3})[S.view]||1;
function navSync(){if(NAV.fromPop)return;const L=navLevel();
 if(L>NAV.depth){while(NAV.depth<L){try{history.pushState({ma:NAV.depth+1},'')}catch(e){}NAV.depth++}}
 else if(L<NAV.depth){const n=NAV.depth-L;NAV.depth=L;NAV.ignore++;try{history.go(-n)}catch(e){NAV.ignore--}}}
['renderHome','renderWho','renderWelcome','renderLearn','renderParents','renderLook','renderQ','renderEnd'].forEach(n=>{
 const f=window[n];if(typeof f!=='function')return;window[n]=function(){const r=f.apply(this,arguments);navSync();return r}});
/* a tap anywhere puts back any missing steps (the phone only keeps steps made after a tap) */
document.addEventListener('click',()=>{if(!NAV.fromPop&&NAV.depth<navLevel())navSync()},true);
function navAsk(title,text,btns){openSheet(`<h2>${title}</h2><p>${text}</p><div class="sheetbtns">${btns}</div>`,(S.topic&&S.topic.style)||'--c:var(--geo);--cs:var(--geo-soft)')}
window.addEventListener('popstate',()=>{
 if(NAV.ignore>0){NAV.ignore--;return}
 NAV.depth=Math.max(0,NAV.depth-1);
 NAV.fromPop=true;
 try{
  if(document.getElementById('sheetback')){closeSheet();return}
  const v=S.view;
  if(v==='q'){hush();navAsk('Stop this round?',"These answers won't be saved.",'<button class="ghost" data-act="navstay">Keep going</button><button class="primary" data-act="navstop">Stop</button>');return}
  if(v==='end'){renderLearn();return}
  if(v==='learn'||v==='parents'||v==='look'){if(prof())renderHome();else renderWho();return}
  navAsk('Close Maths Adventure?','Press the back button again to close. Or tap Stay to keep playing.','<button class="primary" data-act="navstay">Stay</button>');
 }finally{NAV.fromPop=false}});

NAV.fromPop=true;if(prof())renderHome();else if(DB.profiles.length)renderWho();else renderWelcome();NAV.fromPop=false;
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
